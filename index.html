function shuffle(a){for(var n=a.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var t=a[n];a[n]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function chips(){var h="";CATS.forEach(function(c){var all=ids(c),n=all.filter(function(k){return known[k]}).length;h+='<button class="chip" data-c="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'<small>'+(mode==="flip"?n+"/":"")+all.length+'</small></button>'});document.getElementById("chips").innerHTML=h}
function render(){
  if(mode!=="flip")return qrender();
  chips();var all=ids(cat),n=all.filter(function(k){return known[k]}).length;
  document.getElementById("bar").style.width=(n/all.length*100)+"%";
  document.getElementById("mastered").textContent=n+" of "+all.length+" learned";
  var a=document.getElementById("area");
  if(i>=deck.length){
    document.getElementById("pos").textContent="Finished";
    var left=all.length-n;
    a.innerHTML='<div class="done"><h2>'+(deck.length?'Round complete':'Everything learned')+'</h2><p>'+(left?left+' card'+(left>1?'s':'')+' still to learn.':'You know all '+all.length+' cards in this topic.')+'</p>'+(left?'<button class="btn go" id="again">Review remaining</button>':'')+'<button class="btn" id="all">Start over with all cards</button></div>';
    var b=document.getElementById("again");if(b)b.onclick=function(){build(true)};
    document.getElementById("all").onclick=function(){build(false)};return;
  }
  var d=D[deck[i]];
  document.getElementById("pos").textContent="Card "+(i+1)+" of "+deck.length;
  a.innerHTML='<div class="stage"><button class="card'+(flipped?' flip':'')+'" id="card" aria-label="Flashcard. Press to flip."><div class="face f" aria-hidden="'+flipped+'"><span class="tag">'+esc(d[0])+'</span><div class="q">'+esc(d[1])+'</div><span class="hint">Tap to flip</span></div><div class="face b" aria-hidden="'+!flipped+'"><div class="a">'+esc(d[2])+'</div><div class="note">'+esc(d[3])+'</div></div></button></div><div class="row"><button class="btn" id="no">Again</button><button class="btn go" id="yes">Got it</button></div><div class="sr" aria-live="polite"></div>';
  document.getElementById("card").onclick=flip;
  document.getElementById("no").onclick=function(){grade(false)};
  document.getElementById("yes").onclick=function(){grade(true)};
}
function flip(){var c=document.getElementById("card");if(!c)return;flipped=!flipped;c.classList.toggle("flip",flipped);c.querySelector(".f").setAttribute("aria-hidden",flipped);c.querySelector(".b").setAttribute("aria-hidden",!flipped)}
function grade(ok){
  if(i>=deck.length)return;var k=deck[i];
  if(ok){known[k]=1;save()}else{delete known[k];save();deck.push(k)}
  i++;flipped=false;render();
}
document.getElementById("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;cat=b.getAttribute("data-c");build(false)};
document.getElementById("shuf").onclick=function(){if(mode!=="flip")return build();shuffle(deck);i=0;flipped=false;render()};
document.getElementById("reset").onclick=function(){if(confirm("Clear all saved progress?")){known={};save();build(false)}};
document.addEventListener("keydown",function(e){
  if(e.target.closest&&e.target.closest(".chip"))return;
  if(e.key===" "||e.key==="Enter"){if(document.getElementById("card")&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flip()}}
  else if(mode==="flip"&&e.key==="1")grade(false);else if(mode==="flip"&&e.key==="2")grade(true);
});
function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim()}
function bare(t){return norm(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function qrender(){
  chips();var a=document.getElementById("area"),pm=document.getElementById("pos"),ms=document.getElementById("mastered");
  document.getElementById("bar").style.width=(i/deck.length*100)+"%";ms.textContent="Score "+score;
  if(i>=deck.length){pm.textContent="Finished";a.innerHTML='<div class="qbox"><h2 style="margin:0 0 8px;font:700 1.7rem Bricolage Grotesque,system-ui,sans-serif">'+score+' of '+deck.length+' correct</h2><p>'+(score===deck.length?"Perfect round.":"Run another round to improve.")+'</p><button class="btn go" id="rs" style="max-width:260px">New round</button></div>';document.getElementById("rs").onclick=function(){build()};return}
  var x=X[deck[i]],gap=mode==="gap",c0=x[2].split("|")[0];pm.textContent="Question "+(i+1)+" of "+deck.length;
  var h='<div class="qbox"><span class="tag">'+esc(x[0])+", "+["beginner","intermediate","advanced"][x[5]]+'</span><div class="q">'+esc(x[1])+'</div>';
  if(!gap){opts=shuffle([c0].concat(x[3]));h+='<div class="opts">'+opts.map(function(o,k){return '<button class="btn opt" data-o="'+k+'">'+esc(o)+'</button>'}).join("")+'</div>'}
  else h+='<input id="inp" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn go" id="chk">Check</button>';
  a.innerHTML=h+'<div class="fb" id="fb" aria-live="polite"></div></div>';
  function settle(ok,extra){ans=ok;if(ok)score++;
    document.getElementById("fb").innerHTML=(ok?"<b>Correct.</b> ":"<b>Not quite.</b> Answer: <b>"+esc(c0)+"</b>. ")+esc(x[4])+(extra?" "+esc(extra):"")+'<button class="btn go" id="nx">'+(i+1<deck.length?"Next":"See score")+'</button>';
    var n=document.getElementById("nx");n.onclick=function(){i++;ans=null;render()};n.focus();
    document.getElementById("bar").style.width=((i+1)/deck.length*100)+"%";ms.textContent="Score "+score}
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(ans!==null)return;var ok=opts[b.dataset.o]===c0;b.classList.add(ok?"ok":"bad");document.querySelectorAll(".opt").forEach(function(o){if(opts[o.dataset.o]===c0)o.classList.add("ok");o.disabled=true});settle(ok)}});
  if(gap){var inp=document.getElementById("inp");inp.focus();
    var chk=function(){if(ans!==null||!norm(inp.value))return;var al=x[2].split("|"),ok=al.some(function(t){return norm(t)===norm(inp.value)}),cl=!ok&&al.some(function(t){return bare(t)===bare(inp.value)});inp.disabled=true;document.getElementById("chk").disabled=true;settle(ok||cl,cl?"Mind the accent: "+al[0]+".":"")};
    document.getElementById("chk").onclick=chk;inp.onkeydown=function(e){if(e.key==="Enter")chk()}}
}
document.getElementById("len").onchange=function(){build()};document.getElementById("lvl").onchange=function(){lv=+this.value;build()};
document.getElementById("modes").onclick=function(e){var b=e.target.closest(".chip");if(!b||!b.dataset.m)return;mode=b.dataset.m;document.querySelectorAll("#modes select").forEach(function(e){e.style.display=mode==="flip"?"none":""});document.querySelectorAll("#modes .chip").forEach(function(c){c.setAttribute("aria-pressed",c===b)});build(false)};
build(false);
var dip=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e;document.getElementById("install").hidden=false});
document.getElementById("install").onclick=function(){if(!dip)return;dip.prompt();dip.userChoice.then(function(){dip=null;document.getElementById("install").hidden=true})};
window.addEventListener("appinstalled",function(){document.getElementById("install").hidden=true});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
