<style>
:root{--bg:#e9f0ee;--ink:#10302f;--mute:#4d6a68;--front:#fffdf5;--back:#17585d;--backink:#fff8dc;--lemon:#f1c932;--line:#b9cdca;--chip:#d7e5e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1f1f;--ink:#e8f1ee;--mute:#92b0ac;--front:#14302f;--back:#f1c932;--backink:#10302f;--line:#2b4a48;--chip:#183836}}
:root[data-theme="dark"]{--bg:#0c1f1f;--ink:#e8f1ee;--mute:#92b0ac;--front:#14302f;--back:#f1c932;--backink:#10302f;--line:#2b4a48;--chip:#183836}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Literata",Georgia,serif;line-height:1.5;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:22px 16px 40px}
h1{font:700 2rem/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.chip{flex:none;font:500 .88rem "Bricolage Grotesque",system-ui,sans-serif;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--lemon);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin-bottom:12px}
.stage{perspective:1200px}
.card{position:relative;width:100%;height:340px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);font:inherit;color:inherit;text-align:center;display:block}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;overflow:auto;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.f{background:var(--front)}
.b{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.tag{font:500 .85rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--mute)}
.q{font:600 1.45rem/1.35 "Literata",Georgia,serif;white-space:pre-line;max-width:30ch}
.a{font:700 1.6rem/1.35 "Bricolage Grotesque",system-ui,sans-serif;white-space:pre-line}
.note{font-size:.95rem;opacity:.9;max-width:42ch;white-space:pre-line}
.hint{font-size:.82rem;color:var(--mute)}
.row{display:flex;gap:12px;margin-top:26px}
.btn{flex:1;font:700 1rem "Bricolage Grotesque",system-ui,sans-serif;padding:13px;border-radius:12px;border:2px solid var(--ink);cursor:pointer;color:var(--ink);background:var(--front)}
.btn.go{background:var(--lemon);color:#10302f}
.btn:disabled{opacity:.4;cursor:default}
.tools{display:flex;gap:16px;justify-content:center;margin-top:18px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:.88rem;text-decoration:underline;cursor:pointer}
.done{border:2px solid var(--ink);border-radius:18px;background:var(--front);box-shadow:6px 6px 0 var(--ink);padding:40px 24px;text-align:center}
.done h2{font:700 1.7rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px}
.done .btn{max-width:260px;margin:12px auto 0;display:block;width:100%}
:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
@media (max-width:480px){.card{height:380px}.q{font-size:1.25rem}.a{font-size:1.35rem}}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qbox{border:2px solid var(--ink);border-radius:18px;background:var(--front);box-shadow:6px 6px 0 var(--ink);padding:28px 20px;text-align:center}
.qbox .q{margin:12px auto 0}
.opts{display:grid;gap:10px;margin:20px auto 0;max-width:340px}
.opt.ok,.opt.ok:disabled{background:var(--lemon);color:#10302f;opacity:1}
.opt.bad{text-decoration:line-through}
.inp{display:block;width:100%;max-width:300px;margin:20px auto 12px;font:600 1.2rem "Literata",Georgia,serif;text-align:center;padding:11px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.fb{margin-top:16px;font-size:.95rem}
.fb .btn{display:block;max-width:220px;margin:12px auto 0}
#chk{max-width:220px;margin:0 auto}
.w{cursor:pointer;border-bottom:1px dotted currentColor}
.face,.qbox{font-size:calc(1rem*var(--fs,1))}
.q{font-size:1.45em!important}.a{font-size:1.6em!important}.note{font-size:.95em!important}.tag{font-size:.85em!important}
.card{height:calc(340px*var(--fs,1))!important}
@media (max-width:480px){.card{height:calc(380px*var(--fs,1))!important}.q{font-size:1.25em!important}.a{font-size:1.35em!important}}
.link:disabled{opacity:.35;cursor:default}
#tsel{padding:7px 10px}#tsel option{background:var(--front);color:var(--ink)}
</style>
</head>
<body>
<main>
  <select id="lang" class="chip" aria-label="Language" style="float:right"><option value="en">English</option><option value="fr">Français</option></select>
  <h1>Grammatica</h1>
  <p class="sub">Italian grammar flashcards. Tap the card to see the answer.</p>
  <div class="modes" id="modes" role="group" aria-label="Study mode"><button class="chip" data-m="flip" aria-pressed="true">Flip cards</button><button class="chip" data-m="choose" aria-pressed="false">Multiple choice</button><button class="chip" data-m="gap" aria-pressed="false">Fill the gap</button><select id="len" class="chip" aria-label="Number of cards or questions"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="50">50 questions</option><option value="0">All</option></select><select id="lvl" class="chip" aria-label="Level" style="display:none"><option value="-1">All levels</option><option value="0">Beginner</option><option value="1">Intermediate</option><option value="2">Advanced</option></select></div>
  <div class="chips" id="chips" role="group" aria-label="Choose a topic"></div>

    <button class="link" id="fsd" aria-label="Decrease text size">A−</button><span class="hint" id="fsl" aria-live="polite">100%</span><button class="link" id="fsu" aria-label="Increase text size" style="font-size:1.15rem">A+</button>
    <button class="link" id="shuf">Shuffle</button>
    <button class="link" id="reset">Reset progress</button>
    <button class="link" id="install" hidden>Install app</button>
  </div>
  <p class="hint" id="vnote" style="text-align:center"></p>
  <p class="hint" id="kbd" style="text-align:center;margin-top:14px">Keyboard: space flips · 1 = again · 2 = got it · tap an underlined word to hear it</p>

<script>
var CATS=["All","Articles","@tenses","Prepositions","Pronouns","Nouns","Adjectives","Relative pronouns","Sentence structure","Adverbs","Vocabulary","Phrases & expressions","Verbs"];
var D=[
["Articles","The (masc. sing.) before:\nzaino · studente · psicologo","lo zaino · lo studente · lo psicologo","Lo goes before s + consonant, z, gn, ps, x, y. Other consonants take il; vowels take l'."],
["Articles","the friend (f.) · the friends (f.)","l'amica · le amiche","Singular l' before a vowel. The feminine plural is always le."],
["Articles","Plural of:\nil libro · lo zio · l'albero","i libri · gli zii · gli alberi","I replaces il. Gli replaces both lo and l'."],
["Articles","a friend (f.) · a friend (m.)","un'amica · un amico","Only the feminine form takes an apostrophe."],
["Articles","a boy · a student · an uncle","un ragazzo · uno studente · uno zio","Uno follows the same rule as lo: s + consonant, z, gn, ps."],
["Articles","Pick the article:\n__ gnocchi · __ hotel · __ yogurt","gli gnocchi · l'hotel · lo yogurt","H is silent, so hotel counts as a vowel start. Y acts like s + consonant."],
["Present tense","essere (to be)\nio · tu · lui · noi · voi · loro","sono · sei · è · siamo · siete · sono","Note the accent on è (is) versus e (and)."],
["Present tense","avere (to have)\nio · tu · lui · noi · voi · loro","ho · hai · ha · abbiamo · avete · hanno","The h is always silent."],
["Present tense","parlare (regular -are)\nio · tu · lei · noi · voi · loro","parlo · parli · parla · parliamo · parlate · parlano","Endings: -o -i -a -iamo -ate -ano."],
["Present tense","finire (-isc- verb)\nio · tu · lei · loro","finisco · finisci · finisce · finiscono","Noi and voi skip -isc-: finiamo, finite. Verbs like dormire never add it: dormo."],
["Present tense","andare\nio · noi · loro","vado · andiamo · vanno","Irregular in three forms; voi andate is regular."],
["Present tense","fare\nio · tu · noi · voi","faccio · fai · facciamo · fate","Fare also means 'to make' and appears in weather phrases: fa freddo."],
["Present tense","potere · volere · dovere\n(io form)","posso · voglio · devo","Followed by an infinitive: Voglio mangiare."],
["Present tense","venire · uscire\n(io · noi)","vengo, veniamo · esco, usciamo","Both change their stem in the io form."],
["Passato prossimo","How is the passato prossimo formed?","avere or essere (present) + past participle","Ho mangiato. Sono andato."],
["Passato prossimo","Past participles of:\nmangiare · vendere · dormire","mangiato · venduto · dormito","-are → -ato, -ere → -uto, -ire → -ito."],
["Passato prossimo","Irregular participles:\nfare · dire · vedere · prendere","fatto · detto · visto · preso","Also: scrivere → scritto, aprire → aperto, mettere → messo."],
["Passato prossimo","Which verbs take essere?","Movement, change of state and reflexive verbs","andare, venire, partire, arrivare, nascere, morire, restare, plus svegliarsi and every reflexive verb."],
["Passato prossimo","Maria __ (andare) a Roma ieri.","Maria è andata a Roma ieri.","With essere, the participle agrees with the subject: andato, andata, andati, andate."],
["Passato prossimo","Ho visto Marta.\nReplace Marta with a pronoun.","L'ho vista.","With lo, la, li, le the participle agrees with the pronoun. Lo and la drop to l' before ho."],
["Prepositions","di + il · a + la · in + i · su + lo · da + gli","del · alla · nei · sullo · dagli","Di, a, da, in, su merge with the article. Con and per usually stay separate."],
["Prepositions","Vado __ Italia · __ Roma · __ casa · __ dentista","in Italia · a Roma · a casa · dal dentista","In for countries, a for cities and casa, da + person for 'to someone's place'."],
["Prepositions","Studio italiano __ due anni.","da","Da + present tense: an action that began in the past and continues."],
["Prepositions","Marco's book · I'm from Milan","il libro di Marco · Sono di Milano","Di marks possession, origin and material."],
["Prepositions","Parto __ treno · __ piedi · __ macchina","in treno · a piedi · in macchina","Transport takes in. On foot is the exception: a piedi."],
["Pronouns","Replace the object:\nVedo Marco · Maria · i ragazzi · le ragazze","Lo vedo · La vedo · Li vedo · Le vedo","The pronoun goes before the conjugated verb."],
["Pronouns","Do il libro a Maria.\nDo il libro a Marco.\nUse a pronoun.","Le do il libro.\nGli do il libro.","Le = to her, gli = to him."],
["Pronouns","Reflexive: svegliarsi\nio · tu · lui · noi","mi sveglio · ti svegli · si sveglia · ci svegliamo","The pronoun changes with the subject; the verb stays regular."],
["Pronouns","Do il libro a te.\nReplace both nouns.","Te lo do.","Indirect comes first. Mi, ti, ci, vi become me, te, ce, ve. Gli and le become glielo: Glielo do."],
["Pronouns","Formal 'you':\nHow are you? · Do you speak English?","Come sta? · Lei parla inglese?","Lei takes the third-person singular verb."],
["Pronouns","Voglio vedere Marco.\nUse a pronoun, two ways.","Lo voglio vedere. · Voglio vederlo.","With a modal verb, the pronoun goes before it or attaches to the infinitive, which drops its final -e."],
["Nouns & adjectives","Plural:\nlibro · casa · studente · città · uovo","libri · case · studenti · città · uova","-o → -i, -a → -e, -e → -i. Accented endings don't change. Uovo has the irregular feminine plural uova."],
["Nouns & adjectives","Plural:\namico · amica · lago · luogo","amici · amiche · laghi · luoghi","Feminine -ca/-ga always become -che/-ghe. Masculine -co/-go vary: amici, but fuochi."],
["Nouns & adjectives","Plural:\nil problema · il programma · la mano","i problemi · i programmi · le mani","Greek-origin nouns in -ma are masculine. La mano is feminine despite -o."],
["Nouns & adjectives","Agree the adjective:\nuna ragazza (alto) · dei ragazzi (simpatico)","una ragazza alta · dei ragazzi simpatici","Adjectives match gender and number and usually follow the noun."],
["Nouns & adjectives","bello before a noun:\nlibro · zaino · amico · amici","un bel libro · un bello zaino · un bell'amico · dei begli amici","Bello follows the pattern of the definite article."],
["Nouns & adjectives","Plural:\nuna casa grande · un libro verde","due case grandi · due libri verdi","Adjectives in -e have one singular form and -i in the plural."],
["Subjunctive","When is the subjunctive used?","After opinion, doubt, wish and emotion + che","Penso che sia vero. Voglio che tu venga. Spero che stia bene. The subject usually changes after che."],
["Subjunctive","Present subjunctive of essere and avere\n(io · tu · lui · noi)","sia · sia · sia · siamo\nabbia · abbia · abbia · abbiamo","Io, tu and lui share one form, so keep the subject pronoun."],
["Subjunctive","Present subjunctive:\nparlare · credere · dormire (lui)","parli · creda · dorma","-are verbs take -i; -ere and -ire verbs take -a."],
["Subjunctive","Penso che or So che: which needs the subjunctive?","Penso che","Sapere states a fact (So che è vero). Also triggers: bisogna che, è meglio che, sebbene, affinché."],
["Conditional","Conditional of volere · potere · dovere (io)","vorrei · potrei · dovrei","Used for polite requests: Vorrei un caffè."],
["Conditional","Conditional of parlare · credere · dormire (io)","parlerei · crederei · dormirei","Infinitive minus -e, plus -ei, -esti, -ebbe, -emmo, -este, -ebbero. In -are verbs a becomes e."],
["Conditional","Conditional of essere and avere\n(io · lui)","sarei, sarebbe\navrei, avrebbe","Irregular stems. Also andare → andrei, fare → farei, venire → verrei."],
["Conditional","If I had time, I would travel.","Se avessi tempo, viaggerei.","Hypothetical 'if': se + imperfect subjunctive, then the conditional."],
["Imperative","Imperative of parlare\n(tu · Lei · noi · voi)","parla · parli · parliamo · parlate","The Lei form borrows the present subjunctive."],
["Imperative","Imperative of prendere and finire\n(tu · voi)","prendi, prendete\nfinisci, finite","Regular -ere and -ire verbs share the same endings: -i and -ete or -ite."],
["Imperative","Irregular tu imperative:\nandare · fare · dire · essere","va' · fa' · di' · sii","Also stare → sta', dare → da'. The voi forms are regular: andate, fate, dite, siate."],
["Imperative","Don't speak! (to a friend)","Non parlare!","Negative tu uses non + infinitive. Other persons just add non: Non parli, Lei."],
["Relative pronouns","che or cui?","Che is subject or object; cui follows a preposition","La ragazza che parla. Il libro che leggo. La ragazza a cui scrivo."],
["Relative pronouns","The man whose daughter is a doctor","L'uomo la cui figlia è medico","Between article and noun, cui means 'whose'. The article agrees with the noun owned."],
["Relative pronouns","Who studies, learns.","Chi studia impara.","Chi means 'whoever' and takes a singular verb."],
["Relative pronouns","Join:\nIl film è bello. Ho visto il film.","Il film che ho visto è bello.","Che replaces the repeated noun. Don't add a pronoun: not 'che lo ho visto'."]
];
var ADV="Make adverbs:\nlento · felice · facile · regolare|lentamente · felicemente · facilmente · regolarmente|Feminine adjective + -mente. Adjectives ending in -le or -re drop the e: facile → facilmente.#Make adverbs:\nrapido · vero · probabile · particolare|rapidamente · veramente · probabilmente · particolarmente|Same rule: rapida + mente, vera + mente.#She sings well. · He sings badly.|Canta bene. · Canta male.|Bene and male are adverbs. The adjectives are buono and cattivo: un buon vino.#I feel better. · It's going worse.|Sto meglio. · Va peggio.|Meglio and peggio are the adverbs; migliore and peggiore are the adjectives.#Agree if needed:\nvery tired (f.) · many friends (f.)|molto stanca · molte amiche|Before an adjective or verb, molto is an adverb and never changes. Before a noun it is an adjective and agrees.#too much · too little · enough · so much|troppo · poco · abbastanza · tanto|Invariable when they modify a verb or adjective: Mangio troppo.#now · immediately · soon/early · late|adesso · subito · presto · tardi|Presto means both soon and early.#already · still/yet · just (now) · never|già · ancora · appena · mai|Ho già mangiato. Non ho ancora mangiato. Sono appena arrivato.#here · there · over there|qui · lì · laggiù|Qua and là are similar but less exact than qui and lì.#everywhere · nowhere · somewhere|dappertutto · da nessuna parte · da qualche parte|Non lo trovo da nessuna parte. Double negatives are normal in Italian.#near · far · in front · behind|vicino · lontano · davanti · dietro|They become prepositions with a or di: vicino a casa, davanti alla scuola.#above · below · inside · outside|sopra · sotto · dentro · fuori|Il gatto è sotto il tavolo.#always · often · sometimes · rarely|sempre · spesso · qualche volta · raramente|Also: di solito (usually), ogni tanto (every now and then).#I have already eaten.|Ho già mangiato.|Già, ancora, appena, sempre and mai go between the auxiliary and the participle.#I never eat meat.|Non mangio mai la carne.|Non goes before the verb and mai after it.#I don't smoke any more. · I haven't eaten yet.|Non fumo più. · Non ho ancora mangiato.|Non … più means no longer; non … ancora means not yet.#Me too. · Me neither.|Anch'io. · Neanch'io.|Also nemmeno io and neppure io.#Marco is taller than Luca.|Marco è più alto di Luca.|Più or meno + adjective + di before a noun or pronoun. Use che to compare two adjectives or verbs.#She speaks more slowly than me.|Parla più lentamente di me.|The same pattern works for adverbs.#very well · very slowly · very late|benissimo · pianissimo · tardissimo|Drop the final vowel and add -issimo.#He is as tall as his brother.|È alto come suo fratello.|Also tanto … quanto: È tanto alto quanto suo fratello.#where · when · how · why · how much|dove · quando · come · perché · quanto|Perché means both why and because.#How are you? Fine, thanks, and you?|Come stai? Bene, grazie, e tu?|Formal: Come sta? Bene, grazie, e Lei?#He walks slowly. · a slow train|Cammina lentamente. · un treno lento|Adverbs never change; adjectives agree with the noun.#Adjectives used as adverbs:\nloud · hard · expensive|forte · duro · caro|Parla forte. Lavora duro. Costa caro. They stay masculine singular.#maybe · of course · really · exactly|forse · certo · davvero · proprio|Proprio also means 'really': È proprio bello.#only · even · almost · about|solo · perfino · quasi · circa|Quasi: Sono quasi pronto.";

var TXR=[[/^Italian word order is usually subject – verb – object; the subject pronoun is often dropped\./,"L'ordre des mots italien est généralement sujet – verbe – complément ; le pronom sujet est souvent omis."],[/^Put non directly before the verb\./,"Placez non directement devant le verbe."],[/^Question words: chi \(who\), che cosa \(what\), dove \(where\), quando \(when\), perché \(why\), come \(how\), quanto \(how much\), quale \(which\)\./,"Mots interrogatifs : chi (qui), che cosa (quoi), dove (où), quando (quand), perché (pourquoi), come (comment), quanto (combien), quale (quel)."],[/^With non before the verb, the negative words nessuno, niente, mai, più, ancora come after it\./,"Avec non devant le verbe, les mots négatifs nessuno, niente, mai, più, ancora viennent après."],[/^With modal verbs the pronoun can attach to the infinitive \(which drops its -e\) or go before the modal\./,"Avec un verbe modal, le pronom peut s'attacher à l'infinitif (qui perd son -e) ou se placer avant le modal."],[/^Se \+ imperfect subjunctive, then the conditional \(unreal present\)\./,"Se + subjonctif imparfait, puis le conditionnel (irréel du présent)."],[/^Se \+ pluperfect subjunctive, then the conditional perfect \(unreal past\)\./,"Se + subjonctif plus-que-parfait, puis le conditionnel passé (irréel du passé)."],[/^Passive: essere \+ past participle \(agreeing with the subject\) \+ da \+ agent\./,"Passif : essere + participe passé (accordé avec le sujet) + da + complément d'agent."],[/^Si \+ third person; the verb agrees with the noun that follows: /,"Si + troisième personne ; le verbe s'accorde avec le nom qui suit : "],[/^Put the words in order: /,"Remettez les mots dans l'ordre : "],[/^Make it negative: /,"Mettez à la forme négative : "],[/^Replace the object with a pronoun and attach it: /,"Remplacez le complément par un pronom et collez-le : "],[/^Replace the object with a pronoun and put it first: /,"Remplacez le complément par un pronom et placez-le en premier : "],[/^Passive: /,"Passif : "],[/^Su \+ il becomes sul\./,"Su + il devient sul."],[/^Z takes lo\./,"Z prend lo."],[/^The feminine plural is always le\./,"Le pluriel féminin est toujours le."],[/^Andare is irregular: /,"Andare est irrégulier : "],[/^Finire adds -isc- except for noi and voi\./,"Finire ajoute -isc- sauf pour noi et voi."],[/^Andare takes essere, and the participle agrees with the subject\./,"Andare se conjugue avec essere, et le participe s'accorde avec le sujet."],[/^(Fare|Prendere) has an irregular participle: /,"$1 a un participe irrégulier : "],[/^Da \+ il merges into dal when you go to a person\./,"Da + il devient dal quand on va chez quelqu'un."],[/^Lo replaces a masculine singular direct object\./,"Lo remplace un complément d'objet direct masculin singulier."],[/^Le means 'to her'\./,"Le signifie « à elle »."],[/^Reflexive pronoun for io: mi\./,"Pronom réfléchi pour io : mi."],[/^Adjectives in -e form the plural in -i\./,"Les adjectifs en -e forment leur pluriel en -i."],[/^Masculine plural of amico is amici\./,"Le pluriel masculin d'amico est amici."],[/^Bello shortens to bel before most masculine consonants\./,"Bello devient bel devant la plupart des consonnes masculines."],[/^(Pensare|Volere) che takes the subjunctive\./,"$1 che demande le subjonctif."],[/^The conditional makes requests polite\./,"Le conditionnel rend les demandes polies."],[/^Conditional of -are verbs: stem \+ -erei\./,"Conditionnel des verbes en -are : radical + -erei."],[/^Tu imperative of -are verbs ends in -a\./,"L'impératif à tu des verbes en -are se termine en -a."],[/^Very (.*) \(-issimo\): __$/,"Superlatif en -issimo de « $1 » : __"],[/, pronoun only\)/,", pronom seulement)"],[/, plural\)/,", pluriel)"],[/^Il, i and un go before most masculine nouns; la, le and una before feminine ones\./,"Il, i et un se placent devant la plupart des noms masculins ; la, le et una devant les noms féminins."],[/^Before a vowel the singular article becomes l'; masculine indefinite stays un\./,"Devant une voyelle, l'article singulier devient l' ; l'indéfini masculin reste un."],[/^Before a vowel the singular article becomes l'; feminine indefinite is un'\./,"Devant une voyelle, l'article singulier devient l' ; l'indéfini féminin est un'."],[/^Lo, gli and uno go before s \+ consonant, z, gn, ps, x, y\./,"Lo, gli et uno se placent devant s + consonne, z, gn, ps, x, y."],[/^Plural: i for il, gli for lo and l' \(masculine\), le for all feminine nouns\./,"Pluriel : i pour il, gli pour lo et l' (masculin), le pour tous les noms féminins."],[/^Un before most masculine nouns, uno before s \+ consonant or z, una or un' for feminine\./,"Un devant la plupart des noms masculins, uno devant s + consonne ou z, una ou un' au féminin."],[/^Cities take a\./,"Les villes prennent a."],[/^Countries take in\./,"Les pays prennent in."],[/^Di marks possession\./,"Di marque la possession."],[/^Usual patterns: in for countries, a for cities, da for people and origin, di for possession, and articulated forms before nouns\./,"Schémas usuels : in pour les pays, a pour les villes, da pour les personnes et l'origine, di pour la possession, et les formes articulées devant les noms."],[/Di, a, da, in and su merge with the article\./,"Di, a, da, in et su fusionnent avec l'article."],[/^Lo, la, li, le replace a direct object and go before the verb\./,"Lo, la, li, le remplacent un complément d'objet direct et se placent avant le verbe."],[/^Reflexive pronouns: /,"Pronoms réfléchis : "],[/^Indirect object pronouns: le \(to her\), gli \(to him\), ti \(to you\), vi \(to you all\)\./,"Pronoms compléments indirects : le (à elle), gli (à lui), ti (à toi), vi (à vous)."],[/^After a preposition use the stressed pronouns: /,"Après une préposition, on emploie les pronoms toniques : "],[/^Indirect comes first; mi, ti, ci, vi become me, te, ce, ve; gli\/le \+ lo\/la\/li\/le is written as one word: glielo\./,"L'indirect vient en premier ; mi, ti, ci, vi deviennent me, te, ce, ve ; gli/le + lo/la/li/le s'écrit en un mot : glielo."],[/^Adjectives agree in gender and number: /,"Les adjectifs s'accordent en genre et en nombre : "],[/Adjectives agree in gender and number with the noun\./,"Les adjectifs s'accordent en genre et en nombre avec le nom."],[/^Bello follows the article: bel \(il\), bello \(lo\), bell' \(l'\)\./,"Bello suit l'article : bel (il), bello (lo), bell' (l')."],[/^Plural: bei \(i\), begli \(gli\), belle \(le\)\./,"Pluriel : bei (i), begli (gli), belle (le)."],[/^Quello follows the article too: /,"Quello suit aussi l'article : "],[/^Plural: quei \(i\), quegli \(gli\), quelle \(le\)\./,"Pluriel : quei (i), quegli (gli), quelle (le)."],[/Rule: -o → -i, -a → -e, -e → -i\./,"Règle : -o → -i, -a → -e, -e → -i."],[/Feminine -ca\/-ga take h \(amiche\); -io loses the o \(zii, figli\)\./,"Les féminins en -ca/-ga prennent h (amiche) ; -io perd le o (zii, figli)."],[/Irregular or invariable plural\./,"Pluriel irrégulier ou invariable."],[/^Participle of (.*): /,"Participe passé de $1 : "],[/ takes essere, so the participle agrees: /," se conjugue avec essere : le participe s'accorde : "],[/ takes (avere|essere): /," se conjugue avec $1 : "],[/^Imperative \(tu, Lei, noi, voi\) of /,"Impératif (tu, Lei, noi, voi) de "],[/^Verb \+ preposition \+ infinitive: /,"Verbe + préposition + infinitif : "],[/^Negative tu command: non \+ infinitive\./,"Impératif négatif à tu : non + infinitif."],[/^Irregular imperative: fare, dire, essere, andare, venire, stare and avere don't follow the regular pattern\./,"Impératif irrégulier : fare, dire, essere, andare, venire, stare et avere ne suivent pas le schéma régulier."],[/^Che is the subject or direct object\./,"Che est sujet ou complément d'objet direct."],[/^After a preposition use cui\./,"Après une préposition, on emploie cui."],[/^Chi means 'whoever' and takes a singular verb\./,"Chi signifie « celui qui » et prend un verbe au singulier."],[/^Dove replaces 'in cui' for places\./,"Dove remplace « in cui » pour les lieux."],[/^Il cui, la cui, i cui, le cui mean 'whose'; the article agrees with the noun that follows\./,"Il cui, la cui, i cui, le cui signifient « dont » ; l'article s'accorde avec le nom qui suit."],[/^Quello che and ciò che mean 'what' \(the thing that\)\./,"Quello che et ciò che signifient « ce que »."],[/^Già, ancora, appena, sempre and mai go between the auxiliary and the participle\./,"Già, ancora, appena, sempre et mai se placent entre l'auxiliaire et le participe."],[/Feminine form \+ -mente; -le and -re drop the e\./,"Féminin + -mente ; -le et -re perdent le e."],[/^Agree the adjective:/,"Accordez l'adjectif :"],[/^Definite article \(plural\):/,"Article défini (pluriel) :"],[/^Definite article:/,"Article défini :"],[/^Indefinite article \(a\/an\):/,"Article indéfini (un/une) :"],[/^Indefinite article \(plural, some\):/,"Article indéfini (pluriel, des) :"],[/^Plural of “(.*)”: __$/,"Pluriel de « $1 » : __"],[/^Make an adverb: /,"Formez l'adverbe : "],[/^Very (.*) \(-issimo\): __$/,"Très $1 (-issimo) : __"],[/^Combine: /,"Combinez : "],[/^Present of /,"Présent de "],[/^Present subjunctive of /,"Subjonctif présent de "],[/^Conditional of /,"Conditionnel de "],[/^Imperative of /,"Impératif de "],[/Masculine noun\./g,"Nom masculin."],[/Feminine noun\./g,"Nom féminin."],[/Lo\/uno before s \+ consonant, z, gn, ps, x, y\./g,"Lo/uno devant s + consonne, z, gn, ps, x, y."],[/Before a vowel the definite article is l' and the indefinite is un'\./g,"Devant une voyelle, l'article défini est l' et l'indéfini est un'."],[/Before a vowel the definite article is l'\./g,"Devant une voyelle, l'article défini est l'."],[/Regular article pattern\./g,"Schéma régulier."],[/Irregular plural: it becomes feminine\./g,"Pluriel irrégulier : il devient féminin."],[/The plural is invariable\./g,"Le pluriel est invariable."],[/Example: /g,"Exemple : "],[/Conjugation: /g,"Conjugaison : "],[/Present: /g,"Présent : "],[/Passato prossimo: /g,"Passé composé : "],[/Regular -(are|ere|ire) verb/g,"Verbe var FC={"Articles":["Article défini, masculin singulier :\nzaino · studente · psicologo · libro · amico||Défini = le/l'. Lo devant s + consonne, z, gn, ps, x, y ; il devant les autres consonnes ; l' devant une voyelle.","Article défini, féminin singulier :\namica · casa · isola · scuola||Défini = la/l'. Au féminin : la, ou l' devant une voyelle.","Article défini, pluriel :\nil libro · lo zio · l'albero · la casa||Pluriel défini : i pour il, gli pour lo et l' (masculin), le pour tous les noms féminins.","Article indéfini (un/une), masculin :\namico · libro · zaino · studente||Indéfini = un. Un en général, uno devant s + consonne, z, gn, ps, x, y.","Article indéfini (un/une), féminin :\namica · casa · isola · scuola||Indéfini = une. Una, ou un' devant une voyelle.","Pluriel indéfini (des) :\nlibro · zio · amica · casa||Le pluriel de un/una est le partitif : dei, degli, delle.","Ajoutez l'article défini (le/la) :\n__ gnocchi · __ hotel · __ yogurt||Le h est muet : hotel prend donc l'. Le y se comporte comme s + consonne.","Défini ou indéfini ?\nl'amie · une amie||Article défini pour une personne ou une chose précise et connue ; indéfini pour n'importe laquelle.","Article défini dans les généralités :\nLa musique est belle. · L'italien est facile.||L'italien emploie l'article défini avec les noms abstraits, les généralités et les langues.","Article défini avec les jours (habitude) :\nLe dimanche, je me repose.||Il ou la devant un jour signifie « chaque » : la domenica = le dimanche (habituellement)."],
"Present tense":["essere (être)\nio · tu · lui · noi · voi · loro||Notez l'accent sur è (est) par rapport à e (et).","avere (avoir)\nio · tu · lui · noi · voi · loro||Le h est toujours muet.","parlare (régulier en -are)\nio · tu · lei · noi · voi · loro||Terminaisons : -o -i -a -iamo -ate -ano.","finire (verbe en -isc-)\nio · tu · lei · loro||Noi et voi n'ont pas -isc- : finiamo, finite. Des verbes comme dormire n'ajoutent jamais -isc- : dormo.","||Irrégulier à trois personnes ; voi andate est régulier.","fare\nio · tu · noi · voi||Fare signifie aussi « fabriquer » et sert pour la météo : fa freddo.","potere · volere · dovere\n(forme io)||Suivis d'un infinitif : Voglio mangiare.","||Les deux changent de radical à la forme io."],
"Passato prossimo":["Comment se forme le passato prossimo ?|avere ou essere (présent) + participe passé|Ho mangiato. Sono andato.","Participes passés de :\nmangiare · vendere · dormire||-are → -ato, -ere → -uto, -ire → -ito.","Participes irréguliers :\nfare · dire · vedere · prendere||Aussi : scrivere → scritto, aprire → aperto, mettere → messo.","Quels verbes se conjuguent avec essere ?|Les verbes de mouvement, de changement d'état et les verbes pronominaux|andare, venire, partire, arrivare, nascere, morire, restare, ainsi que svegliarsi et tous les verbes pronominaux.","||Avec essere, le participe s'accorde avec le sujet : andato, andata, andati, andate.","Ho visto Marta.\nRemplacez Marta par un pronom.||Avec lo, la, li, le, le participe s'accorde avec le pronom. Lo et la deviennent l' devant ho."],
"Prepositions":["||Di, a, da, in, su fusionnent avec l'article. Con et per restent généralement séparés.","||In pour les pays, a pour les villes et casa, da + personne pour « chez quelqu'un ».","||Da + présent : une action commencée dans le passé qui continue.","Le livre de Marco · Je viens de Milan||Di marque la possession, l'origine et la matière.","||Les transports prennent in. Exception : à pied = a piedi."],
"Pronouns":["Remplacez le complément :\nVedo Marco · Maria · i ragazzi · le ragazze||Le pronom se place avant le verbe conjugué.","Do il libro a Maria.\nDo il libro a Marco.\nUtilisez un pronom.||Le = à elle, gli = à lui.","Pronominal : svegliarsi\nio · tu · lui · noi||Le pronom change avec le sujet ; le verbe reste régulier.","Do il libro a te.\nRemplacez les deux noms.||L'indirect vient en premier. Mi, ti, ci, vi deviennent me, te, ce, ve. Gli et le deviennent glielo : Glielo do.","Le « vous » de politesse :\nComment allez-vous ? · Parlez-vous anglais ?||Lei prend le verbe à la troisième personne du singulier.","Voglio vedere Marco.\nUtilisez un pronom, de deux façons.||Avec un verbe modal, le pronom se place avant lui ou s'attache à l'infinitif, qui perd son -e final."],
"Nouns":["Pluriel :\nlibro · casa · studente · città · uovo||-o → -i, -a → -e, -e → -i. Les terminaisons accentuées ne changent pas. Uovo a le pluriel féminin irrégulier uova.","Pluriel :\namico · amica · lago · luogo||Les féminins en -ca/-ga donnent toujours -che/-ghe. Les masculins en -co/-go varient : amici, mais fuochi.","Pluriel :\nil problema · il programma · la mano||Les noms d'origine grecque en -ma sont masculins. La mano est féminin malgré le -o."],
"Adjectives":["Accordez l'adjectif :\nuna ragazza (alto) · dei ragazzi (simpatico)||Les adjectifs s'accordent en genre et en nombre et se placent généralement après le nom.","bello devant un nom :\nlibro · zaino · amico · amici||Bello suit le modèle de l'article défini.","Pluriel :\nuna casa grande · un libro verde||Les adjectifs en -e ont une seule forme au singulier et -i au pluriel."],
"Subjunctive":["Quand emploie-t-on le subjonctif ?|Après une opinion, un doute, un souhait et une émotion + che|Penso che sia vero. Voglio che tu venga. Spero che stia bene. Le sujet change généralement après che.","Subjonctif présent d'essere et d'avere\n(io · tu · lui · noi)||Io, tu et lui ont la même forme : gardez donc le pronom sujet.","Subjonctif présent :\nparlare · credere · dormire (lui)||Les verbes en -are prennent -i ; les verbes en -ere et -ire prennent -a.","Penso che ou So che : lequel demande le subjonctif ?||Sapere exprime un fait (So che è vero). Autres déclencheurs : bisogna che, è meglio che, sebbene, affinché."],
"Conditional":["Conditionnel de volere · potere · dovere (io)||Sert aux demandes polies : Vorrei un caffè.","Conditionnel de parlare · credere · dormire (io)||Infinitif sans -e, plus -ei, -esti, -ebbe, -emmo, -este, -ebbero. Dans les verbes en -are, a devient e.","Conditionnel d'essere et d'avere\n(io · lui)||Radicaux irréguliers. Aussi : andare → andrei, fare → farei, venire → verrei.","Si j'avais le temps, je voyagerais.||Hypothèse : se + subjonctif imparfait, puis le conditionnel."],
"Imperative":["Impératif de parlare\n(tu · Lei · noi · voi)||La forme Lei emprunte le subjonctif présent.","Impératif de prendere et finire\n(tu · voi)||Les verbes réguliers en -ere et -ire ont les mêmes terminaisons : -i et -ete ou -ite.","Impératif irrégulier à la forme tu :\nandare · fare · dire · essere||Aussi : stare → sta', dare → da'. Les formes en voi sont régulières : andate, fate, dite, siate.","Ne parle pas ! (à un ami)||Le tu négatif utilise non + infinitif. Aux autres personnes, on ajoute simplement non : Non parli, Lei."],
"Relative pronouns":["che ou cui ?|Che est sujet ou objet ; cui suit une préposition|La ragazza che parla. Il libro che leggo. La ragazza a cui scrivo.","L'homme dont la fille est médecin||Entre l'article et le nom, cui signifie « dont le/la ». L'article s'accorde avec le nom possédé.","Qui étudie, apprend.||Chi signifie « celui qui » et prend un verbe au singulier.","Reliez :\nIl film è bello. Ho visto il film.||Che remplace le nom répété. N'ajoutez pas de pronom : pas « che lo ho visto »."],
"Adverbs":["Formez des adverbes :\nlento · felice · facile · regolare||Féminin de l'adjectif + -mente. Les adjectifs en -le ou -re perdent le e : facile → facilmente.","Formez des adverbes :\nrapido · vero · probabile · particolare||Même règle : rapida + mente, vera + mente.","Elle chante bien. · Il chante mal.||Bene et male sont des adverbes. Les adjectifs sont buono et cattivo : un buon vino.","Je me sens mieux. · Ça va plus mal.||Meglio et peggio sont les adverbes ; migliore et peggiore sont les adjectifs.","Accordez si nécessaire :\ntrès fatiguée · beaucoup d'amies||Devant un adjectif ou un verbe, molto est un adverbe invariable. Devant un nom, c'est un adjectif et il s'accorde.","trop · trop peu · assez · tant||Invariables quand ils portent sur un verbe ou un adjectif : Mangio troppo.","maintenant · tout de suite · bientôt/tôt · tard||Presto signifie à la fois « bientôt » et « tôt ».","déjà · encore · à l'instant · jamais||Ho già mangiato. Non ho ancora mangiato. Sono appena arrivato.","ici · là · là-bas||Qua et là sont proches mais moins précis que qui et lì.","partout · nulle part · quelque part||Non lo trovo da nessuna parte. Les doubles négations sont normales en italien.","près · loin · devant · derrière||Avec a ou di, ils deviennent des prépositions : vicino a casa, davanti alla scuola.","au-dessus · en dessous · dedans · dehors||Il gatto è sotto il tavolo.","toujours · souvent · parfois · rarement||Aussi : di solito (d'habitude), ogni tanto (de temps en temps).","J'ai déjà mangé.||Già, ancora, appena, sempre et mai se placent entre l'auxiliaire et le participe.","Je ne mange jamais de viande.||Non se place avant le verbe et mai après.","Je ne fume plus. · Je n'ai pas encore mangé.||Non … più signifie « ne … plus » ; non … ancora signifie « pas encore ».","Moi aussi. · Moi non plus.||Aussi : nemmeno io et neppure io.","Marco est plus grand que Luca.||Più ou meno + adjectif + di devant un nom ou un pronom. Utilisez che pour comparer deux adjectifs ou deux [["Basic word order:\nMarco eats the apple.","Marco mangia la mela.",NS.ord,"Ordre des mots de base :\nMarco mange la pomme.","L'ordre des mots italien est généralement sujet – verbe – complément ; le pronom sujet est souvent omis."],["Negation:\nI don't eat meat.","Non mangio la carne.",NS.neg,"Négation :\nJe ne mange pas de viande.","Placez non directement devant le verbe."],["Double negation:\nI never see anyone.","Non vedo mai nessuno.","After non + verb you add negative words: mai, nessuno, niente, più, ancora. Double negatives are normal.","Double négation :\nJe ne vois jamais personne.","Après non + verbe, on ajoute des mots négatifs : mai, nessuno, niente, più, ancora. La double négation est normale."],["Yes/no question:\nDo you speak Italian?","Parli italiano?","Keep the statement word order and raise your voice; no auxiliary like 'do' is needed.","Question fermée :\nParles-tu italien ?","Gardez l'ordre de la phrase affirmative et montez la voix ; aucun auxiliaire comme « do » n'est nécessaire."],["Question words:\nwho · what · where · when · why · how","chi · che cosa · dove · quando · perché · come","Also: quanto (how much), quale (which). The question word comes first: Dove abiti?","Mots interrogatifs :\nqui · quoi · où · quand · pourquoi · comment","Aussi : quanto (combien), quale (quel). Le mot interrogatif vient en premier : Dove abiti?"],["Pronoun placement:\nI see him.","Lo vedo.","Object pronouns go before the conjugated verb.","Place du pronom :\nJe le vois.","Les pronoms compléments se placent devant le verbe conjugué."],["Pronoun with an infinitive:\nI want to buy it. (two ways)","Lo voglio comprare. · Voglio comprarlo.",NS.cl,"Pronom avec l'infinitif :\nJe veux l'acheter. (de deux façons)","Avec un verbe modal, le pronom peut s'attacher à l'infinitif (qui perd son -e) ou se placer avant le modal."],["Pronoun with the imperative:\nBuy it! · Don't buy it!","Compralo! · Non lo comprare!","In the affirmative imperative the pronoun attaches to the verb; in the negative it goes before or attaches to the infinitive.","Pronom et impératif :\nAchète-le ! · Ne l'achète pas !","À l'impératif affirmatif, le pronom s'attache au verbe ; au négatif, il se place devant ou s'attache à l'infinitif."],["Adjective position:\na nice house · a big man (great man)","una bella casa · un uomo grande · un grand'uomo","Most adjectives follow the noun; common ones (bello, buono, grande, piccolo, nuovo, vecchio) can come before it, sometimes changing the meaning.","Place de l'adjectif :\nune belle maison · un homme grand (grand homme)","La plupart des adjectifs suivent le nom ; les plus courants (bello, buono, grande, piccolo, nuovo, vecchio) peuvent le précéder, parfois avec un changement de sens."],["Adverb position:\nI have already eaten.","Ho già mangiato.","With compound tenses, short adverbs (già, ancora, appena, sempre, mai) go between the auxiliary and the participle.","Place de l'adverbe :\nJ'ai déjà mangé.","Aux temps composés, les adverbes courts (già, ancora, appena, sempre, mai) se placent entre l'auxiliaire et le participe."],["Emphasis (dislocation):\nThe pizza, I'm eating it.","La pizza la mangio io.","Italian often moves the object to the front and repeats it with a pronoun for emphasis.","Mise en relief (dislocation) :\nLa pizza, c'est moi qui la mange.","L'italien place souvent le complément en tête de phrase et le reprend par un pronom pour insister."],["Conjunctions:\nbecause · but · so · although","perché · ma · quindi · anche se","Perché, ma, quindi join clauses; benché/sebbene (although) take the subjunctive, anche se usually the indicative.","Conjonctions :\nparce que · mais · donc · bien que","Perché, ma, quindi relient des propositions ; benché/sebbene (bien que) demandent le subjonctif, anche se (même si) généralement l'indicatif."],["If-sentence, real:\nIf it rains, I stay home.","Se piove, resto a casa.","Possible situations: se + present, then present or future.","Hypothèse réelle :\nS'il pleut, je reste à la maison.","Situations possibles : se + présent, puis présent ou futur."],["If-sentence, unreal (present):\nIf I had time, I would travel.","Se avessi tempo, viaggerei.",NS.s2,"Hypothèse irréelle (présent) :\nSi j'avais le temps, je voyagerais.","Se + subjonctif imparfait, puis le conditionnel (irréel du présent)."],["If-sentence, unreal (past):\nIf I had studied, I would have passed.","Se avessi studiato, avrei passato l'esame.",NS.s3,"Hypothèse irréelle (passé) :\nSi j'avais étudié, j'aurais réussi.","Se + subjonctif plus-que-parfait, puis le conditionnel passé (irréel du passé)."],["Passive voice:\nThe book is read by Marco.","Il libro è letto da Marco.","essere + past participle (agreeing with the subject) + da for the agent. Venire can replace essere: viene letto.","Voix passive :\nLe livre est lu par Marco.","essere + participe passé (accordé avec le sujet) + da pour l'agent. Venire peut remplacer essere : viene letto."],["Impersonal si:\nHere Italian is spoken.","Qui si parla italiano.",NS.si,"Si impersonnel :\nIci on parle italien.","Si + troisième personne ; le verbe s'accorde avec le nom qui suit : si mangia la pizza, si mangiano le pizze."],["Reported speech:\nHe said: “I am tired.”","Ha detto che era stanco.","After a past reporting verb, tenses shift: present → imperfect, future → conditional perfect, passato prossimo → trapassato.","Discours indirect :\nIl a dit : « Je suis fatigué. »","Après un verbe introducteur au passé, les temps changent : présent → imparfait, futur → conditionnel passé, passato prossimo → trapassato."],["Time clauses:\nWhen I arrive, I'll call you.","Quando arriverò, ti chiamerò.","After quando, appena, dopo che Italian uses the future for a future event; the future perfect marks the earlier action.","Propositions temporelles :\nQuand j'arriverai, je t'appellerai.","Après quando, appena, dopo che, l'italien emploie le futur pour un événement futur ; le futur antérieur marque l'action antérieure."],["Purpose:\nI study to learn. · I study so that you learn.","Studio per imparare. · Studio affinché tu impari.","Per + infinitive when the subject is the same; affinché + subjunctive when it changes.","But :\nJ'étudie pour apprendre. · J'étudie pour que tu apprennes.","Per + infinitif quand le sujet est le même ; affinché + subjonctif quand il change."]].forEach(function(r){D.push([SSC,r[0],r[1],r[2],r[3],r[4]])});
